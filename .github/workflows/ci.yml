name: CI — DZ-rami

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extracted
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: extracted/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        continue-on-error: true
        run: npm run lint

      - name: Tests unitaires (moteur de jeu)
        run: npm test

      - name: Build de production (Next.js)
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build
